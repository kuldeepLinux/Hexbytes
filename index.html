<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEX SEO INTELLIGENCE</title>
    <style>
        :root { --primary: #2563eb; --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --text-muted: #94a3b8; --success: #22c55e; --warning: #eab308; --danger: #ef4444; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem; }
        .container { width: 100%; max-width: 800px; }
        header { text-align: center; margin-bottom: 2rem; }
        h1 { font-size: 2.5rem; font-weight: 800; letter-spacing: -0.05em; background: linear-gradient(to right, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { color: var(--text-muted); margin-top: 0.5rem; }
        .input-group { display: flex; gap: 0.5rem; margin-bottom: 2rem; }
        input[type="url"] { flex: 1; padding: 1rem; border-radius: 0.5rem; border: 1px solid #334155; background: var(--card); color: white; font-size: 1rem; }
        input[type="url"]:focus { outline: 2px solid var(--primary); border-color: transparent; }
        button { padding: 1rem 2rem; border: none; border-radius: 0.5rem; background: var(--primary); color: white; font-weight: 600; cursor: pointer; font-size: 1rem; transition: background 0.2s; }
        button:hover { background: #1d4ed8; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #results { display: none; }
        .score-card { background: var(--card); border-radius: 1rem; padding: 2rem; text-align: center; margin-bottom: 1.5rem; border: 1px solid #334155; }
        .score-value { font-size: 4rem; font-weight: 800; }
        .score-label { color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.875rem; }
        .checks-grid { display: grid; gap: 1rem; }
        .check-item { background: var(--card); border-radius: 0.75rem; padding: 1rem 1.5rem; border: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .check-name { font-weight: 500; }
        .status { padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        .status.pass { background: rgba(34, 197, 94, 0.2); color: var(--success); }
        .status.warn { background: rgba(234, 179, 8, 0.2); color: var(--warning); }
        .status.fail { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
        .detail { color: var(--text-muted); font-size: 0.875rem; margin-top: 0.25rem; }
        .loading { text-align: center; padding: 2rem; color: var(--text-muted); }
        .error-box { background: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger); color: #fca5a5; padding: 1rem; border-radius: 0.5rem; margin-bottom: 1rem; display: none; }
        footer { margin-top: 3rem; color: var(--text-muted); font-size: 0.875rem; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>HEX SEO INTELLIGENCE</h1>
            <p class="subtitle">On-Page SEO Audit · Client-Side · No Server Needed</p>
        </header>

        <div class="input-group">
            <input type="url" id="urlInput" placeholder="https://example.com" value="https://example.com">
            <button id="auditBtn" onclick="runAudit()">Audit</button>
        </div>

        <div id="errorBox" class="error-box"></div>
        <div id="loading" class="loading" style="display:none;">Fetching & analyzing page...</div>
        <div id="results"></div>

        <footer>HEX SEO INTELLIGENCE · Made by Kuldeep</footer>
    </div>

    <script>
        const CORS_PROXY = 'https://api.allorigins.win/raw?url=';

        async function runAudit() {
            const urlInput = document.getElementById('urlInput');
            const btn = document.getElementById('auditBtn');
            const results = document.getElementById('results');
            const loading = document.getElementById('loading');
            const errorBox = document.getElementById('errorBox');

            let url = urlInput.value.trim();
            if (!url.startsWith('http')) url = 'https://' + url;

            // Reset UI
            results.style.display = 'none';
            errorBox.style.display = 'none';
            loading.style.display = 'block';
            btn.disabled = true;

            try {
                const response = await fetch(CORS_PROXY + encodeURIComponent(url));
                if (!response.ok) throw new Error(`Fetch failed: ${response.status}`);
                const html = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');

                const audit = performAudit(doc, url);
                renderResults(audit);
            } catch (err) {
                errorBox.textContent = 'Error: ' + err.message + '. (Some sites may block CORS proxies)';
                errorBox.style.display = 'block';
            } finally {
                loading.style.display = 'none';
                btn.disabled = false;
            }
        }

        function performAudit(doc, url) {
            const checks = [];
            let score = 0;
            const maxScore = 100;

            // 1. Title
            const title = doc.querySelector('title');
            const titleText = title ? title.textContent.trim() : '';
            if (titleText.length >= 30 && titleText.length <= 60) {
                checks.push({ name: 'Title Tag', status: 'pass', detail: `${titleText.length} chars (optimal 30-60)` });
                score += 15;
            } else if (titleText.length > 0) {
                checks.push({ name: 'Title Tag', status: 'warn', detail: `${titleText.length} chars (recommended 30-60)` });
                score += 8;
            } else {
                checks.push({ name: 'Title Tag', status: 'fail', detail: 'Missing or empty' });
            }

            // 2. Meta Description
            const metaDesc = doc.querySelector('meta[name="description"]');
            const descText = metaDesc ? metaDesc.getAttribute('content')?.trim() || '' : '';
            if (descText.length >= 120 && descText.length <= 160) {
                checks.push({ name: 'Meta Description', status: 'pass', detail: `${descText.length} chars (optimal 120-160)` });
                score += 15;
            } else if (descText.length > 0) {
                checks.push({ name: 'Meta Description', status: 'warn', detail: `${descText.length} chars (recommended 120-160)` });
                score += 8;
            } else {
                checks.push({ name: 'Meta Description', status: 'fail', detail: 'Missing' });
            }

            // 3. H1
            const h1s = doc.querySelectorAll('h1');
            if (h1s.length === 1) {
                checks.push({ name: 'H1 Heading', status: 'pass', detail: 'Exactly one H1 found' });
                score += 10;
            } else if (h1s.length === 0) {
                checks.push({ name: 'H1 Heading', status: 'fail', detail: 'No H1 found' });
            } else {
                checks.push({ name: 'H1 Heading', status: 'warn', detail: `${h1s.length} H1 tags found (should be 1)` });
                score += 5;
            }

            // 4. Canonical
            const canonical = doc.querySelector('link[rel="canonical"]');
            if (canonical && canonical.getAttribute('href')) {
                checks.push({ name: 'Canonical URL', status: 'pass', detail: 'Present' });
                score += 10;
            } else {
                checks.push({ name: 'Canonical URL', status: 'fail', detail: 'Missing' });
            }

            // 5. Open Graph
            const ogTitle = doc.querySelector('meta[property="og:title"]');
            const ogDesc = doc.querySelector('meta[property="og:description"]');
            const ogImage = doc.querySelector('meta[property="og:image"]');
            if (ogTitle && ogDesc && ogImage) {
                checks.push({ name: 'Open Graph', status: 'pass', detail: 'Title, description, image present' });
                score += 10;
            } else {
                const missing = [];
                if (!ogTitle) missing.push('title');
                if (!ogDesc) missing.push('description');
                if (!ogImage) missing.push('image');
                checks.push({ name: 'Open Graph', status: 'warn', detail: `Missing: ${missing.join(', ')}` });
                score += 5;
            }

            // 6. Image Alt
            const images = doc.querySelectorAll('img');
            let missingAlt = 0;
            images.forEach(img => { if (!img.hasAttribute('alt') || !img.getAttribute('alt').trim()) missingAlt++; });
            if (images.length === 0) {
                checks.push({ name: 'Image Alt Attributes', status: 'pass', detail: 'No images to check' });
                score += 10;
            } else if (missingAlt === 0) {
                checks.push({ name: 'Image Alt Attributes', status: 'pass', detail: `All ${images.length} images have alt` });
                score += 10;
            } else {
                checks.push({ name: 'Image Alt Attributes', status: 'warn', detail: `${missingAlt}/${images.length} images missing alt` });
                score += 5;
            }

            // 7. Viewport
            const viewport = doc.querySelector('meta[name="viewport"]');
            if (viewport) {
                checks.push({ name: 'Mobile Viewport', status: 'pass', detail: 'Present' });
                score += 10;
            } else {
                checks.push({ name: 'Mobile Viewport', status: 'fail', detail: 'Missing' });
            }

            // 8. Lang Attribute
            const lang = doc.documentElement.getAttribute('lang');
            if (lang) {
                checks.push({ name: 'Language Attribute', status: 'pass', detail: `lang="${lang}"` });
                score += 10;
            } else {
                checks.push({ name: 'Language Attribute', status: 'fail', detail: 'Missing on <html>' });
            }

            // 9. HTTPS
            if (url.startsWith('https://')) {
                checks.push({ name: 'HTTPS', status: 'pass', detail: 'Secure connection' });
                score += 10;
            } else {
                checks.push({ name: 'HTTPS', status: 'fail', detail: 'Not using HTTPS' });
            }

            return { url, score, checks };
        }

        function renderResults(audit) {
            const results = document.getElementById('results');
            let scoreColor = 'var(--success)';
            if (audit.score < 50) scoreColor = 'var(--danger)';
            else if (audit.score < 80) scoreColor = 'var(--warning)';

            let checksHtml = '';
            audit.checks.forEach(c => {
                checksHtml += `
                    <div class="check-item">
                        <div>
                            <div class="check-name">${c.name}</div>
                            <div class="detail">${c.detail}</div>
                        </div>
                        <span class="status ${c.status}">${c.status}</span>
                    </div>
                `;
            });

            results.innerHTML = `
                <div class="score-card">
                    <div class="score-value" style="color: ${scoreColor}">${audit.score}</div>
                    <div class="score-label">Overall Score / 100</div>
                </div>
                <div class="checks-grid">
                    ${checksHtml}
                </div>
            `;
            results.style.display = 'block';
        }
    </script>
</body>
</html>
